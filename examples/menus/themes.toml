name = "themes"
name_pretty = "Themes"
description = "Switch the shell palette"
icon = "󰏘"

# Each entry runs epochctl, so the launcher, a keybinding and a script all take the same path --
# and all of them end up writing the same state file the shell is watching.
action = "%VALUE%"

# One entry per shipped theme. These cannot be generated from what is installed, so a theme added
# under ~/.local/share/epochshell/themes wants a line here too -- or just use the picker in the
# system menu, which builds itself from disk. `epochctl theme list` is the authority on what exists.

[[entries]]
text = "Dark"
subtext = "The default palette"
value = "epochctl theme set dark"
keywords = ["theme", "palette", "colour", "color", "dark", "default", "night"]

[[entries]]
text = "Light"
subtext = "Plain white ground"
value = "epochctl theme set light"
keywords = ["theme", "palette", "colour", "color", "light", "day", "bright", "white"]

[[entries]]
text = "Gruvbox"
subtext = "Warm retro browns and orange"
value = "epochctl theme set gruvbox"
keywords = ["theme", "palette", "colour", "color", "gruvbox", "retro", "warm", "brown"]

