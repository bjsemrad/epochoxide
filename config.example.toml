socket = "/run/user/1000/epochoxide.sock"
file_roots = ["~"]
ignored_dirs = ["~/.cache", "~/.local/share/Trash", "~/.cargo/registry", "~/.rustup", "~/.npm", "~/.pnpm-store", "~/.var/app", ".git", "node_modules", "target", "dist", "build", ".direnv"]
menus_dir = "~/.config/epochoxide/menus"
launch_prefix = ""
terminal_cmd = ""
clipboard_max_items = 100
clipboard_image_dir = "~/.cache/epochoxide/clipboard/images"
clipboard_text_editor = "xdg-open"
clipboard_image_editor = ""
clipboard_ocr = false

# LocalSend. Receiving binds a port and answers discovery, so it can be turned off entirely.
# Transfers are never written until they are accepted through the shell.
localsend_receive = true
localsend_download_dir = "~/Downloads"
# Name other devices see. Empty means use the host name.
localsend_alias = ""
# Screenshots. `epochctl capture screenshot [region|window|fullscreen|all]`.
# screenshot_filename is expanded by date(1), so strftime escapes work; its extension picks the
# format (.png, .jpg, .ppm). Every shot is copied to the clipboard and saved by default, and
# announced to the notification server -- which is the shell itself.
screenshot_dir = "~/Pictures/Screenshots"
screenshot_filename = "screenshot-%Y%m%d-%H%M%S.png"
screenshot_copy = true
screenshot_save = true
screenshot_notify = true

# Language `epochctl capture ocr` reads with. Join several with "+" (e.g. "eng+deu") as long as
# the tesseract data files for them are installed.
ocr_language = "eng"

# Screen recording. `epochctl capture record [region|window|fullscreen|all]`, and
# `epochctl capture record stop` to finish. The filename's extension picks the container, so .mkv
# works as well as .mp4.
recording_dir = "~/Videos/Recordings"
recording_filename = "recording-%Y%m%d-%H%M%S.mp4"
recording_notify = true
# A constant framerate is what keeps the file playable: left to time itself, wf-recorder declares
# 90000fps and x264 derives an H.264 level players refuse to decode, so the video opens black.
# Zero hands the timing back to wf-recorder.
recording_framerate = 30

clipboard_capture_interval_ms = 250
runner_scan_path = true
icon_theme = ""
icon_cache_dir = "~/.cache/epochoxide/icons"
thumbnail_cache_enabled = true
persistent_index = true

# How the files provider searches.
#   "auto"   - search with fd, building the in-memory index only if fd is not installed (default)
#   "always" - always build the index: ~200ms -> <10ms per query, but it holds every indexed path
#              in RAM (~1.6KB per entry, so >1GB over a 700k-entry home directory)
#   "never"  - never build the index; the files provider goes quiet if fd is not installed
file_index = "auto"

[provider_enabled]
apps = true
files = true
runner = true
clipboard = true
windows = true
calc = true
menus = true

[provider_weights]
apps = 20000
runner = 12000
calc = 10000
windows = 6000
files = 0
clipboard = 0

[query_prefixes]
">" = "runner"
"/" = "files"
"#" = "clipboard"
"@" = "windows"
"=" = "calc"

# Each menu in menus_dir is its own provider, named after the menu, and takes a prefix here.
"?" = "keybinds"
"!" = "capture"

[[runner_commands]]
name = "Edit Config"
command = "xdg-open ~/.config/epochoxide/config.toml"
keywords = ["epochoxide", "settings"]
icon = "preferences-system"
terminal = false
