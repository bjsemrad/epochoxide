[package]
name = "epochoxide"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Fast Rust desktop shell data provider"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
dirs = "5.0"
meval = "0.2"
notify = "6.1"
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
shellexpand = "3.1"
socket2 = { version = "0.6.5", features = ["all"] }
toml = "0.8"
walkdir = "2.5"
which = "6.0"

[dev-dependencies]
tempfile = "3.10"
